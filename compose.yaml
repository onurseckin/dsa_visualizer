name: dsa-visualizer-dev

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    command: bun run vite --host 0.0.0.0 --port 42000
    environment:
      VITE_USE_DOCKER_API: "1"
    ports:
      - "42000:42000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - dist/
            - .git/

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      API_DATA_DIR: /data
      API_HOST: 0.0.0.0
      API_PORT: "3000"
      PYTHON_RUNNER_URL: http://python-runner:8080
    volumes:
      - api_data:/data
    depends_on:
      python-runner:
        condition: service_healthy
    networks:
      - app
      - runner
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const response = await fetch('http://127.0.0.1:3000/api/health'); process.exit(response.ok ? 0 : 1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - dist/
            - .git/

  python-runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    command: python dev_runner.py
    environment:
      RUNNER_HOST: 0.0.0.0
      RUNNER_PORT: "8080"
      RUNNER_MAX_ACTIVE: "2"
      RUNNER_MAX_REQUEST_THREADS: "4"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    networks:
      - runner
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /run:rw,noexec,nosuid,size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G
          pids: 64
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2); raise SystemExit(0 if response.status == 200 else 1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    develop:
      watch:
        - action: sync+restart
          path: apps/python-runner
          target: /app

networks:
  app:
  runner:
    internal: true

volumes:
  api_data:
    name: dsa-visualizer_api_data
